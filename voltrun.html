<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VOLTRUN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap');

:root{
  --cyan:#00e5ff;
  --magenta:#ff2e9a;
  --amber:#ffd23f;
  --green:#39ff88;
  --violet:#9b5cff;
  --bg:#05060f;
  --panel:rgba(8,10,26,0.86);
  --panel-line:rgba(0,229,255,0.25);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Rajdhani',sans-serif;touch-action:none;}
#app{position:fixed;inset:0;width:100%;height:100%;}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;}

.hidden{display:none !important;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;}

.logo{
  font-family:'Orbitron',sans-serif;
  font-weight:900;
  font-size:clamp(38px,12vw,72px);
  letter-spacing:4px;
  color:#fff;
  text-shadow:0 0 8px var(--cyan),0 0 24px var(--cyan),0 0 46px var(--magenta);
  margin:0;
  animation:logoIn 0.7s cubic-bezier(.2,1.4,.4,1) both;
}
.tagline{
  font-family:'Rajdhani',sans-serif;
  font-weight:600;
  letter-spacing:3px;
  color:var(--cyan);
  opacity:0.85;
  font-size:clamp(11px,3vw,14px);
  margin-top:2px;
  text-transform:uppercase;
}
@keyframes logoIn{
  0%{opacity:0;transform:translateY(-30px) scale(0.85);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}

#splash{gap:10px;}
.loadbar-track{width:min(70vw,320px);height:6px;background:rgba(255,255,255,0.08);border-radius:4px;margin-top:28px;overflow:hidden;border:1px solid var(--panel-line);}
.loadbar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 10px var(--cyan);}
.tip{margin-top:14px;color:#9fb4c9;font-size:13px;letter-spacing:1px;min-height:18px;}

#dashboard{gap:14px;padding:20px;width:100%;max-width:480px;}
.stat-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.stat-chip{
  background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;
  padding:8px 16px;display:flex;flex-direction:column;align-items:center;min-width:96px;
}
.stat-chip .val{font-family:'Orbitron';font-weight:700;font-size:18px;color:var(--amber);text-shadow:0 0 8px rgba(255,210,63,0.6);}
.stat-chip .lbl{font-size:10px;letter-spacing:2px;color:#7fa0b8;margin-top:2px;}

.btn{
  font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:2px;
  border:none;border-radius:14px;cursor:pointer;color:#04121a;
  transition:transform 0.08s ease;
}
.btn:active{transform:scale(0.93);}
.btn-play{
  font-size:clamp(20px,5vw,26px);padding:16px 54px;margin-top:6px;
  background:linear-gradient(135deg,var(--cyan),var(--green));
  box-shadow:0 0 22px rgba(0,229,255,0.6),0 6px 0 #007a8c;
}
.btn-small{
  font-size:13px;padding:10px 18px;background:linear-gradient(135deg,var(--magenta),var(--violet));
  color:#fff;box-shadow:0 4px 0 #7a1256;
}

.outfits{display:flex;gap:12px;margin-top:8px;}
.outfit{
  width:64px;height:78px;border-radius:12px;border:2px solid transparent;
  background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;padding:6px;position:relative;
}
.outfit.selected{border-color:var(--green);box-shadow:0 0 12px var(--green);}
.outfit .swatch{width:26px;height:26px;border-radius:50%;box-shadow:0 0 10px currentColor;}
.outfit .cost{font-size:10px;color:#9fb4c9;letter-spacing:1px;}
.outfit .lock{position:absolute;top:4px;right:6px;font-size:11px;opacity:0.7;}

#sound-toggle{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--panel-line);color:#cfe;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:20;}

/* HUD */
#hud{position:absolute;inset:0;z-index:5;pointer-events:none;}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;}
.hud-block{font-family:'Orbitron';color:#fff;}
.hud-label{font-size:9px;letter-spacing:2px;color:#7fa0b8;}
.hud-value{font-size:18px;font-weight:700;text-shadow:0 0 6px rgba(0,229,255,0.7);}
.hud-center{text-align:center;}
#hud-pause{pointer-events:auto;width:38px;height:38px;border-radius:10px;background:rgba(8,10,26,0.7);border:1px solid var(--panel-line);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:4px;}

.powerup-bar{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:10px;}
.pu-badge{
  width:52px;height:52px;border-radius:12px;background:rgba(8,10,26,0.75);border:1px solid var(--panel-line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:translateY(10px);
  transition:opacity .2s, transform .2s; position:relative; overflow:hidden;
}
.pu-badge.active{opacity:1;transform:translateY(0);}
.pu-badge .ico{font-size:20px;}
.pu-badge .bar{position:absolute;bottom:0;left:0;height:3px;background:var(--cyan);width:100%;}

.combo-pop{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  font-family:'Orbitron';font-weight:800;color:var(--amber);font-size:22px;
  text-shadow:0 0 10px var(--amber);opacity:0;pointer-events:none;
}

/* Overlays */
.overlay{position:absolute;inset:0;background:rgba(2,3,10,0.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:15;}
.panel{
  background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;
  padding:26px 30px;display:flex;flex-direction:column;align-items:center;gap:12px;
  min-width:260px;box-shadow:0 0 40px rgba(0,229,255,0.15);
}
.panel h2{
  font-family:'Orbitron';color:#fff;letter-spacing:3px;margin:0 0 4px 0;font-size:22px;
  text-shadow:0 0 10px var(--magenta);
}
.gostat{display:flex;justify-content:space-between;width:100%;font-size:15px;color:#cfe0ee;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,0.08);}
.gostat b{color:var(--amber);font-family:'Orbitron';font-size:15px;}
.record-badge{
  font-family:'Orbitron';color:#04121a;background:linear-gradient(135deg,var(--amber),var(--magenta));
  padding:5px 14px;border-radius:20px;font-size:12px;letter-spacing:2px;
  animation:pulseGlow 1s ease-in-out infinite;
}
@keyframes pulseGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
.panel-btns{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center;}

#crash-flash{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,50,80,0.35),transparent 70%);opacity:0;pointer-events:none;z-index:8;}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="crash-flash"></div>

  <!-- Splash -->
  <div id="splash" class="screen">
    <h1 class="logo">VOLTRUN</h1>
    <div class="tagline">Run the grid. Beat the pulse.</div>
    <div class="loadbar-track"><div class="loadbar-fill" id="loadfill"></div></div>
    <div class="tip" id="splashtip">Loading the grid…</div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="screen hidden">
    <button id="sound-toggle">🔊</button>
    <h1 class="logo" style="font-size:clamp(30px,9vw,50px)">VOLTRUN</h1>
    <div class="tagline">Run the grid. Beat the pulse.</div>
    <div class="stat-row">
      <div class="stat-chip"><div class="val" id="dashBest">0</div><div class="lbl">BEST SCORE</div></div>
      <div class="stat-chip"><div class="val" id="dashBank">0</div><div class="lbl">COIN BANK</div></div>
    </div>
    <div class="outfits" id="outfitRow"></div>
    <button class="btn btn-play" id="playBtn">PLAY</button>
    <div class="tip" id="dashTip">Swipe to move. Swipe up to jump, down to slide.</div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-block">
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="hudScore">000000</div>
        <div class="hud-label" style="margin-top:6px">COINS</div>
        <div class="hud-value" id="hudCoins" style="color:var(--amber)">0000</div>
      </div>
      <div class="hud-block hud-center">
        <div class="hud-label">DISTANCE</div>
        <div class="hud-value" id="hudDist">0m</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;">
        <div id="hud-pause">❚❚</div>
      </div>
    </div>
    <div class="powerup-bar">
      <div class="pu-badge" id="pu-magnet"><div class="ico">🧲</div><div class="bar"></div></div>
      <div class="pu-badge" id="pu-shield"><div class="ico">🛡</div><div class="bar"></div></div>
      <div class="pu-badge" id="pu-multi"><div class="ico">×2</div><div class="bar"></div></div>
      <div class="pu-badge" id="pu-slow"><div class="ico">⏱</div><div class="bar"></div></div>
    </div>
    <div class="combo-pop" id="comboPop"></div>
  </div>

  <!-- Pause -->
  <div id="pauseOverlay" class="overlay hidden">
    <div class="panel">
      <h2>PAUSED</h2>
      <div class="panel-btns">
        <button class="btn btn-play" style="padding:12px 30px;font-size:16px" id="resumeBtn">RESUME</button>
      </div>
      <div class="panel-btns">
        <button class="btn btn-small" id="restartFromPauseBtn">RESTART</button>
        <button class="btn btn-small" id="homeFromPauseBtn">HOME</button>
      </div>
    </div>
  </div>

  <!-- Game Over -->
  <div id="gameoverOverlay" class="overlay hidden">
    <div class="panel">
      <div id="recordBadge" class="record-badge hidden">NEW RECORD</div>
      <h2>RUN OVER</h2>
      <div style="width:100%">
        <div class="gostat"><span>Score</span><b id="goScore">0</b></div>
        <div class="gostat"><span>Distance</span><b id="goDist">0m</b></div>
        <div class="gostat"><span>Coins Collected</span><b id="goCoins">0</b></div>
        <div class="gostat"><span>Best Score</span><b id="goBest">0</b></div>
      </div>
      <div class="panel-btns">
        <button class="btn btn-play" style="padding:12px 26px;font-size:15px" id="reviveBtn">▶ REVIVE (50 🪙)</button>
      </div>
      <div class="panel-btns">
        <button class="btn btn-small" id="restartBtn">RESTART</button>
        <button class="btn btn-small" id="homeBtn">HOME</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================= CONSTANTS ============================= */
const LANE_X = [-2.2, 0, 2.2];
const GRAVITY = -32;
const JUMP_VELOCITY = 11.5;
const SLIDE_DURATION = 0.62;
const BASE_SPEED = 9.5;
const MAX_SPEED = 25;
const COLLIDE_WINDOW = 0.55;
const CLEANUP_Z = 11;
const SPAWN_Z = -105;
const HORIZON_FOG_FAR = 92;

const OUTFITS = [
  {id:'cyan',   name:'Volt Cyan',    cost:0,    jacket:0x00e5ff, accent:0xff2e9a},
  {id:'amber',  name:'Solar Amber',  cost:500,  jacket:0xffd23f, accent:0x9b5cff},
  {id:'toxic',  name:'Toxic Pulse',  cost:1500, jacket:0x39ff88, accent:0xff2e9a},
];

const TIPS = [
  'Swipe left / right to change lanes',
  'Swipe up to jump low barriers',
  'Swipe down to slide under beams',
  'Grab the shield before a risky run',
  'Magnet pulls in every coin nearby',
  'Speed ramps up the farther you run',
];

/* ============================= STATE ============================= */
let profile = { best:0, bank:0, unlocked:['cyan'], selected:'cyan' };
let audioEnabled = true;
let actx = null;

const S = {
  screen:'splash', // splash, dashboard, playing, paused, gameover
  distance:0, speed:BASE_SPEED, score:0, runCoins:0,
  lane:1, posX:0, posY:0, vy:0,
  isJumping:false, isSliding:false, slideTimer:0,
  alive:true, invuln:0,
  magnetT:0, shieldOn:false, multiT:0, slowT:0,
  obstacleTimer:1.2, coinTimer:0.6, powerupTimer:14, buildingTimer:0,
  usedRevive:false,
  runTime:0,
};

/* ============================= THREE SETUP ============================= */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05060f, 22, HORIZON_FOG_FAR);
scene.background = new THREE.Color(0x05060f);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 4.4, 7.6);

const ambient = new THREE.AmbientLight(0x3a4d7a, 0.75);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xbfe4ff, 0.9);
dirLight.position.set(4, 12, 6);
scene.add(dirLight);
const glowCyan = new THREE.PointLight(0x00e5ff, 1.4, 14);
glowCyan.position.set(-1.6, 2.4, 2);
scene.add(glowCyan);
const glowMag = new THREE.PointLight(0xff2e9a, 1.1, 14);
glowMag.position.set(1.6, 2, 1);
scene.add(glowMag);

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);
onResize();

/* ============================= GROUND ============================= */
function buildGroundTexture(){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0c1c';
  ctx.fillRect(0,0,256,512);
  // lane separators
  ctx.strokeStyle = 'rgba(0,229,255,0.55)';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 10;
  [85,171].forEach(x=>{
    ctx.beginPath();
    for(let y=0;y<512;y+=34){ ctx.moveTo(x,y); ctx.lineTo(x,y+18); }
    ctx.stroke();
  });
  // edge glow lines
  ctx.strokeStyle = 'rgba(255,46,154,0.5)';
  ctx.shadowColor = '#ff2e9a';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(4,512); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(252,0); ctx.lineTo(252,512); ctx.stroke();
  // subtle cross ticks for speed sense
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1;
  for(let y=0;y<512;y+=16){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(256,y); ctx.stroke(); }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 60);
  return tex;
}
const groundTex = buildGroundTexture();
const groundMat = new THREE.MeshStandardMaterial({map:groundTex, roughness:0.75, metalness:0.15});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(8.4, 500), groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.set(0, 0, -180);
scene.add(ground);

/* ============================= PLAYER ============================= */
function makePlayer(){
  const g = new THREE.Group();

  const jacketMat = new THREE.MeshStandardMaterial({color:0x00e5ff, emissive:0x0088aa, emissiveIntensity:0.4, roughness:0.4, metalness:0.3});
  const skinMat = new THREE.MeshStandardMaterial({color:0xffd7b0, roughness:0.6});
  const darkMat = new THREE.MeshStandardMaterial({color:0x14161f, roughness:0.6});
  const accentMat = new THREE.MeshStandardMaterial({color:0xff2e9a, emissive:0xff2e9a, emissiveIntensity:0.9, roughness:0.3});

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.72, 0.4), jacketMat);
  torso.position.y = 1.15;
  g.add(torso);

  const collar = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.08, 0.44), accentMat);
  collar.position.y = 1.5;
  g.add(collar);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16), skinMat);
  head.position.y = 1.72;
  g.add(head);

  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.06), accentMat);
  visor.position.set(0, 1.75, 0.24);
  g.add(visor);

  const cape = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.9), new THREE.MeshStandardMaterial({color:0xff2e9a, emissive:0xff2e9a, emissiveIntensity:0.5, transparent:true, opacity:0.55, side:THREE.DoubleSide}));
  cape.position.set(0, 1.05, -0.24);
  cape.rotation.x = 0.25;
  g.add(cape);

  function limb(len, mat, radiusTop, radiusBottom){
    const pivot = new THREE.Group();
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, len, 8), mat);
    mesh.position.y = -len/2;
    pivot.add(mesh);
    return pivot;
  }

  const legL = limb(0.62, darkMat, 0.11, 0.09); legL.position.set(-0.18, 0.78, 0);
  const legR = limb(0.62, darkMat, 0.11, 0.09); legR.position.set(0.18, 0.78, 0);
  g.add(legL, legR);

  const armL = limb(0.5, jacketMat, 0.09, 0.075); armL.position.set(-0.4, 1.42, 0);
  const armR = limb(0.5, jacketMat, 0.09, 0.075); armR.position.set(0.4, 1.42, 0);
  g.add(armL, armR);

  g.userData.parts = {torso, head, cape, legL, legR, armL, armR, collar, visor};
  g.userData.mats = {jacketMat, accentMat};
  return g;
}
const player = makePlayer();
scene.add(player);

function applyOutfit(id){
  const o = OUTFITS.find(x=>x.id===id) || OUTFITS[0];
  player.userData.mats.jacketMat.color.setHex(o.jacket);
  player.userData.mats.jacketMat.emissive.setHex(o.jacket);
  player.userData.mats.accentMat.color.setHex(o.accent);
  player.userData.mats.accentMat.emissive.setHex(o.accent);
  glowCyan.color.setHex(o.jacket);
  glowMag.color.setHex(o.accent);
}

let shieldMesh = null;
function setShieldVisible(on){
  if(on && !shieldMesh){
    shieldMesh = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 16), new THREE.MeshStandardMaterial({color:0x00e5ff, emissive:0x00e5ff, emissiveIntensity:0.6, transparent:true, opacity:0.22, wireframe:false}));
    shieldMesh.position.y = 1.1;
    player.add(shieldMesh);
  } else if(!on && shieldMesh){
    player.remove(shieldMesh);
    shieldMesh.geometry.dispose(); shieldMesh.material.dispose();
    shieldMesh = null;
  }
}

/* ============================= BUILDINGS ============================= */
const buildings = [];
const buildingColors = [0x00e5ff, 0xff2e9a, 0xffd23f, 0x9b5cff, 0x39ff88];
function spawnBuilding(){
  const side = Math.random()<0.5 ? -1 : 1;
  const h = 6 + Math.random()*20;
  const w = 2.6 + Math.random()*2.4;
  const d = 2.6 + Math.random()*2.4;
  const mat = new THREE.MeshStandardMaterial({color:0x0d0f1c, roughness:0.8, metalness:0.2, emissive:0x0a1020, emissiveIntensity:0.3});
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  const x = side * (5.4 + Math.random()*5);
  mesh.position.set(x, h/2, SPAWN_Z - Math.random()*20);
  scene.add(mesh);

  const signColor = buildingColors[(Math.random()*buildingColors.length)|0];
  const sign = new THREE.Mesh(new THREE.BoxGeometry(w*0.5, h*0.12, 0.1), new THREE.MeshStandardMaterial({color:signColor, emissive:signColor, emissiveIntensity:1.6}));
  sign.position.set(0, h*0.22, d/2 + 0.06);
  mesh.add(sign);

  buildings.push(mesh);
}
for(let i=0;i<16;i++) spawnBuilding();

/* ============================= POOLS: obstacles / coins / powerups ============================= */
const obstacles = []; // {mesh,lane,type,resolved}
const coins = [];     // {mesh,lane,collected}
const powerups = [];  // {mesh,lane,kind,collected}

const OBST_GEOM = {
  LOW: new THREE.BoxGeometry(1.5, 0.85, 0.4),
  HIGH: new THREE.BoxGeometry(1.7, 0.42, 0.4),
  BLOCK: new THREE.BoxGeometry(1.7, 2.15, 0.6),
};
function obstMaterial(type){
  if(type==='LOW') return new THREE.MeshStandardMaterial({color:0xff5533, emissive:0xff5533, emissiveIntensity:0.55, roughness:0.4});
  if(type==='HIGH') return new THREE.MeshStandardMaterial({color:0xffd23f, emissive:0xffd23f, emissiveIntensity:0.55, roughness:0.4});
  return new THREE.MeshStandardMaterial({color:0x9b5cff, emissive:0x9b5cff, emissiveIntensity:0.45, roughness:0.4});
}
function spawnObstacleMesh(lane, z, type){
  const mesh = new THREE.Mesh(OBST_GEOM[type], obstMaterial(type));
  const y = type==='LOW' ? 0.42 : type==='HIGH' ? 1.28 : 1.07;
  mesh.position.set(LANE_X[lane], y, z);
  scene.add(mesh);
  obstacles.push({mesh, lane, type, resolved:false});
}
function spawnObstacleWave(z){
  const roll = Math.random();
  if(roll < 0.34){
    const numBlocked = Math.random()<0.65 ? 1 : 2;
    const lanes = [0,1,2].sort(()=>Math.random()-0.5).slice(0, numBlocked);
    lanes.forEach(l=>spawnObstacleMesh(l, z, 'BLOCK'));
  } else {
    const type = roll < 0.67 ? 'LOW' : 'HIGH';
    const numLanes = [1,1,2,3][(Math.random()*4)|0];
    const lanes = [0,1,2].sort(()=>Math.random()-0.5).slice(0, numLanes);
    lanes.forEach(l=>spawnObstacleMesh(l, z, type));
  }
}

/* ============================= AUDIO ============================= */
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioEnabled=false; }
  } else if(actx.state==='suspended'){
    actx.resume();
  }
}
function tone(freq,duration,type,vol,delay,slideTo){
  if(!audioEnabled || !actx) return;
  const t0 = actx.currentTime + (delay||0);
  const osc = actx.createOscillator();
  osc.type = type||'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+duration);
  const gain = actx.createGain();
  gain.gain.setValueAtTime(vol!==undefined?vol:0.2, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(t0); osc.stop(t0+duration+0.03);
}
function noiseBurst(duration, vol, filterFreq){
  if(!audioEnabled || !actx) return;
  const bufferSize = actx.sampleRate * duration;
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  const src = actx.createBufferSource();
  src.buffer = buffer;
  const filt = actx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.value = filterFreq||600;
  const gain = actx.createGain();
  gain.gain.setValueAtTime(vol||0.2, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+duration);
  src.connect(filt); filt.connect(gain); gain.connect(actx.destination);
  src.start();
}
const SFX = {
  coin(){ tone(1250,0.07,'triangle',0.14); tone(1780,0.06,'triangle',0.11,0.045); },
  jump(){ tone(280,0.16,'sine',0.18,0,680); },
  land(){ tone(140,0.09,'square',0.12); },
  slide(){ noiseBurst(0.22,0.12,700); },
  powerup(){ tone(500,0.08,'square',0.14); tone(700,0.08,'square',0.14,0.07); tone(1000,0.12,'square',0.16,0.14); },
  crash(){ noiseBurst(0.4,0.28,320); tone(90,0.4,'sawtooth',0.22,0,35); },
  button(){ tone(680,0.05,'square',0.1); },
  record(){ tone(660,0.1,'triangle',0.16); tone(880,0.1,'triangle',0.16,0.1); tone(1100,0.18,'triangle',0.18,0.2); },
};

let touchStart = null;
function handleSwipeVector(dx, dy){
  const absX = Math.abs(dx), absY = Math.abs(dy);
  if(Math.max(absX,absY) < 28) return;
  if(absX > absY){
    if(dx < 0) doLeft(); else doRight();
  } else {
    if(dy < 0) doJump(); else doSlide();
  }
}
canvas.addEventListener('touchstart', e=>{
  if(S.screen!=='playing') return;
  const t = e.changedTouches[0];
  touchStart = {x:t.clientX, y:t.clientY};
}, {passive:true});
canvas.addEventListener('touchend', e=>{
  if(S.screen!=='playing' || !touchStart) return;
  const t = e.changedTouches[0];
  handleSwipeVector(t.clientX - touchStart.x, t.clientY - touchStart.y);
  touchStart = null;
}, {passive:true});

window.addEventListener('keydown', e=>{
  if(S.screen==='playing'){
    if(e.key==='ArrowLeft'||e.key==='a') doLeft();
    else if(e.key==='ArrowRight'||e.key==='d') doRight();
    else if(e.key==='ArrowUp'||e.key==='w'||e.key===' ') doJump();
    else if(e.key==='ArrowDown'||e.key==='s') doSlide();
    else if(e.key==='p'||e.key==='Escape') togglePause();
  } else if(S.screen==='paused'){
    if(e.key==='p'||e.key==='Escape') togglePause();
  }
});

function doLeft(){ S.lane = Math.max(0, S.lane-1); }
function doRight(){ S.lane = Math.min(2, S.lane+1); }
function doJump(){
  if(!S.alive) return;
  if(!S.isJumping && !S.isSliding){
    S.isJumping = true; S.vy = JUMP_VELOCITY; SFX.jump();
  }
}
function doSlide(){
  if(!S.alive) return;
  if(!S.isSliding && !S.isJumping){
    S.isSliding = true; S.slideTimer = SLIDE_DURATION; SFX.slide();
  }
}

/* ============================= RUN LIFECYCLE ============================= */
function resetRunState(){
  S.distance=0; S.speed=BASE_SPEED; S.score=0; S.runCoins=0;
  S.lane=1; S.posX=LANE_X[1]; S.posY=0; S.vy=0;
  S.isJumping=false; S.isSliding=false; S.slideTimer=0;
  S.alive=true; S.invuln=0;
  S.magnetT=0; S.shieldOn=false; S.multiT=0; S.slowT=0;
  S.obstacleTimer=1.3; S.coinTimer=0.5; S.powerupTimer=13; S.buildingTimer=0;
  S.usedRevive=false; S.runTime=0;
  setShieldVisible(false);
  clearField();
  player.position.set(LANE_X[1], 0, 0);
  player.rotation.set(0,0,0);
}
function startRun(){
  resetRunState();
  applyOutfit(profile.selected);
  S.screen = 'playing';
  el('dashboard').classList.add('hidden');
  el('gameoverOverlay').classList.add('hidden');
  el('pauseOverlay').classList.add('hidden');
  el('hud').classList.remove('hidden');
  ['pu-magnet','pu-shield','pu-multi','pu-slow'].forEach(id=>el(id).classList.remove('active'));
}
function revivePlayer(){
  S.alive = true;
  S.invuln = 2.2;
  S.usedRevive = true;
  S.lane = 1;
  S.isJumping=false; S.isSliding=false; S.posY=0;
  player.rotation.set(0,0,0);
  el('gameoverOverlay').classList.add('hidden');
  S.screen = 'playing';
}
function saveProfile(){
  try{
    window.storage.set('voltrun_profile', JSON.stringify(profile), false).catch(()=>{});
  }catch(e){ /* storage unavailable; continue without persistence */ }
}
async function loadProfile(){
  try{
    const r = await window.storage.get('voltrun_profile', false);
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      profile = Object.assign(profile, parsed);
      if(!profile.unlocked || !profile.unlocked.length) profile.unlocked = ['cyan'];
      if(!profile.selected) profile.selected = 'cyan';
    }
  }catch(e){ /* first run or storage unavailable */ }
}

function onCrash(){
  if(S.invuln > 0 || !S.alive) return;
  if(S.shieldOn){
    S.shieldOn = false; setShieldVisible(false); S.invuln = 1.0;
    SFX.powerup();
    return;
  }
  S.alive = false;
  SFX.crash();
  el('crash-flash').animate([{opacity:0.9},{opacity:0}], {duration:450});
  finalizeGameOver();
}
function finalizeGameOver(){
  const isRecord = S.score > profile.best;
  if(isRecord) profile.best = S.score;
  profile.bank += S.runCoins;
  saveProfile();

  el('goScore').textContent = fmt(S.score,6);
  el('goDist').textContent = Math.floor(S.distance)+'m';
  el('goCoins').textContent = S.runCoins;
  el('goBest').textContent = profile.best;
  el('recordBadge').classList.toggle('hidden', !isRecord);
  el('reviveBtn').classList.toggle('hidden', S.usedRevive);
  if(isRecord) SFX.record();

  setTimeout(()=>{
    S.screen = 'gameover';
    el('gameoverOverlay').classList.remove('hidden');
  }, 550);
}

function addScore(n){ S.score += Math.round(n * (S.multiT>0?2:1)); }

function updatePowerupUI(dt){
  const map = [['pu-magnet','magnetT'],['pu-shield',null],['pu-multi','multiT'],['pu-slow','slowT']];

function updatePlayer(dt){
  const targetX = LANE_X[S.lane];
  S.posX += (targetX - S.posX) * Math.min(1, dt*10);
  const lean = (targetX - S.posX) * -0.5;

  if(S.isJumping){
    S.vy += GRAVITY*dt;
    S.posY += S.vy*dt;
    if(S.posY <= 0){ S.posY = 0; S.isJumping=false; S.vy=0; SFX.land(); }
  }
  if(S.isSliding){
    S.slideTimer -= dt;
    if(S.slideTimer <= 0){ S.isSliding = false; }
  }

  player.position.set(S.posX, S.posY, 0);
  player.rotation.z = THREE.MathUtils.clamp(lean, -0.35, 0.35);

  const parts = player.userData.parts;
  const speedFactor = S.speed / BASE_SPEED;
  S.runTime += dt * speedFactor * (S.isSliding?0:1);

  if(S.isSliding){
    player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, 1.0, 0.3);
    player.position.y = S.posY - 0.55;
    parts.legL.rotation.x = THREE.MathUtils.lerp(parts.legL.rotation.x, -1.1, 0.3);
    parts.legR.rotation.x = THREE.MathUtils.lerp(parts.legR.rotation.x, -1.1, 0.3);
  } else {
    player.rotation.x = THREE.MathUtils.lerp(player.rotation.x, 0, 0.3);
    if(S.isJumping){
      parts.legL.rotation.x = THREE.MathUtils.lerp(parts.legL.rotation.x, -0.5, 0.2);
      parts.legR.rotation.x = THREE.MathUtils.lerp(parts.legR.rotation.x, 0.7, 0.2);
      parts.armL.rotation.x = THREE.MathUtils.lerp(parts.armL.rotation.x, -0.6, 0.2);
      parts.armR.rotation.x = THREE.MathUtils.lerp(parts.armR.rotation.x, -0.6, 0.2);
    } else {
      const cycle = Math.sin(S.runTime*9);
      parts.legL.rotation.x = cycle*0.9;
      parts.legR.rotation.x = -cycle*0.9;
      parts.armL.rotation.x = -cycle*0.6;
      parts.armR.rotation.x = cycle*0.6;
    }
  }
  parts.cape.rotation.x = 0.25 + Math.sin(S.runTime*6)*0.06;
  if(shieldMesh) shieldMesh.rotation.y += dt*1.5;
}

function updateWorld(dt){
  S.distance += S.speed*dt;
  S.speed = Math.min(MAX_SPEED, BASE_SPEED + S.distance*0.0055);
  addScore(dt * 6);

  groundTex.offset.y -= dt * S.speed * 0.05;

  // buildings
  for(let i=buildings.length-1;i>=0;i--){
    const b = buildings[i];
    b.position.z += S.speed*dt;
    if(b.position.z > CLEANUP_Z + 10){
      b.position.z = SPAWN_Z - Math.random()*40;
      b.position.x = (b.position.x<0?-1:1) * (5.4+Math.random()*5);
      b.geometry.dispose();
      const h = 6+Math.random()*20, w=2.6+Math.random()*2.4, d=2.6+Math.random()*2.4;
      b.geometry = new THREE.BoxGeometry(w,h,d);
      b.position.y = h/2;
    }
  }

  // timers for spawns
  const diffT = Math.max(0, Math.min(1, S.distance/1800));
  S.obstacleTimer -= dt;
  if(S.obstacleTimer <= 0){
    spawnObstacleWave(SPAWN_Z);
    S.obstacleTimer = THREE.MathUtils.lerp(2.0, 1.05, diffT) * (0.8+Math.random()*0.5);
  }
  S.coinTimer -= dt;
  if(S.coinTimer <= 0){
    spawnCoinRow();
    S.coinTimer = 0.9 + Math.random()*0.9;
  }
  S.powerupTimer -= dt;
  if(S.powerupTimer <= 0){
    spawnPowerup();
    S.powerupTimer = 16 + Math.random()*8;
  }

  // obstacles
  for(let i=obstacles.length-1;i>=0;i--){
    const o = obstacles[i];
    o.mesh.position.z += S.speed*dt;
    const z = o.mesh.position.z;
    if(!o.resolved && Math.abs(z) < COLLIDE_WINDOW){
      o.resolved = true;
      let hit = false;
      if(o.type==='BLOCK') hit = (o.lane===S.lane);
      else if(o.type==='LOW') hit = (o.lane===S.lane) && !S.isJumping;
      else if(o.type==='HIGH') hit = (o.lane===S.lane) && !S.isSliding;
      if(hit) onCrash(); else addScore(3);
    }
    if(z > CLEANUP_Z){
      scene.remove(o.mesh);
      obstacles.splice(i,1);
    }
  }

  // coins
  for(let i=coins.length-1;i>=0;i--){
    const c = coins[i];
    c.mesh.position.z += S.speed*dt;
    c.mesh.rotation.y += dt*5;
    if(S.magnetT>0 && !c.collected){
      c.mesh.position.x += (S.posX - c.mesh.position.x) * Math.min(1, dt*6);
      c.mesh.position.y += (1.1 - c.mesh.position.y) * Math.min(1, dt*6);
    } else {
      c.mesh.position.y = c.baseY + Math.sin(S.runTime*4 + i)*0.05;
    }
    const z = c.mesh.position.z;
    if(!c.collected && Math.abs(z) < COLLIDE_WINDOW){
      const laneMatch = c.lane===S.lane || S.magnetT>0;
      const heightOk = c.baseY < 1.3 ? true : (S.isJumping || S.magnetT>0);
      if(laneMatch && heightOk){
        c.collected = true;
        S.runCoins++;
        addScore(5);
        SFX.coin();
        scene.remove(c.mesh);
        coins.splice(i,1);
        continue;
      }
    }
    if(z > CLEANUP_Z){ scene.remove(c.mesh); coins.splice(i,1); }
  }

  // powerups
  for(let i=powerups.length-1;i>=0;i--){
    const p = powerups[i];
    p.mesh.position.z += S.speed*dt;
    p.mesh.rotation.y += dt*3;
    p.mesh.position.y = 1.15 + Math.sin(S.runTime*3+i)*0.08;
    const z = p.mesh.position.z;
    if(!p.collected && Math.abs(z) < COLLIDE_WINDOW && p.lane===S.lane){
      p.collected = true;
      SFX.powerup();
      activatePowerup(p.kind);
      scene.remove(p.mesh);
      powerups.splice(i,1);
      continue;
    }
    if(z > CLEANUP_Z){ scene.remove(p.mesh); powerups.splice(i,1); }
  }

  if(S.magnetT>0) S.magnetT -= dt;
  if(S.multiT>0) S.multiT -= dt;
  if(S.invuln>0) S.invuln -= dt;
  if(S.slowT>0){
    S.slowT -= dt;
  }
}
function activatePowerup(kind){
  if(kind==='magnet'){ S.magnetT = 9; popCombo('MAGNET!', '#9b5cff'); }
  else if(kind==='shield'){ S.shieldOn = true; setShieldVisible(true); popCombo('SHIELD!', '#00e5ff'); }
  else if(kind==='multi'){ S.multiT = 9; popCombo('SCORE x2!', '#ffd23f'); }
  else if(kind==='slow'){
    S.slowT = 6;
    S.speed = Math.max(BASE_SPEED*0.55, S.speed*0.55);
    popCombo('SLOW-MO!', '#39ff88');
  }
}

function updateCamera(dt){
  const speedFactor = (S.speed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED);
  const targetFov = 62 + speedFactor*8;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt*3);
  camera.updateProjectionMatrix();
  camera.position.x += (S.posX*0.35 - camera.position.x) * Math.min(1, dt*4);
  const lookY = 1.2 + (S.isSliding ? -0.3 : 0);
  camera.lookAt(S.posX*0.5, lookY, -6);
}

function updateHUD(){
  el('hudScore').textContent = fmt(S.score,6);
  el('hudCoins').textContent = fmt(S.runCoins,4);
  el('hudDist').textContent = Math.floor(S.distance)+'m';
}

function tick(){
  requestAnimationFrame(tick);
  let dt = Math.min(0.05, clock.getDelta());

  if(S.screen==='playing' && S.alive){
    updatePlayer(dt);
    updateWorld(dt);
    updatePowerupUI(dt);
    updateHUD();
  } else if(S.screen==='dashboard' || S.screen==='splash'){
    // idle attract animation
    S.runTime += dt;
    const parts = player.userData.parts;
    const cycle = Math.sin(S.runTime*6);
    parts.legL.rotation.x = cycle*0.5;
    parts.legR.rotation.x = -cycle*0.5;
    parts.armL.rotation.x = -cycle*0.35;
    parts.armR.rotation.x = cycle*0.35;
    parts.cape.rotation.x = 0.25 + Math.sin(S.runTime*4)*0.05;
    groundTex.offset.y -= dt*0.4;
    camera.position.x += (0 - camera.position.x)*0.05;
    camera.lookAt(0, 1.3, -6);
  }
  updateCamera(dt);
  renderer.render(scene, camera);
}

/* ============================= BOOT ============================= */
async function boot(){
  applyOutfit('cyan');
  player.position.set(LANE_X[1], 0, -1.5);
  camera.position.set(0, 3.6, 5.2);

  const fill = el('loadfill');
  fill.style.transition = 'width 0.9s ease';
  requestAnimationFrame(()=>{ fill.style.width = '100%'; });

  await loadProfile();
  applyOutfit(profile.selected);

  setTimeout(()=>{
    el('splash').classList.add('hidden');
    el('dashboard').classList.remove('hidden');
    S.screen = 'dashboard';
    player.position.set(LANE_X[1], 0, 0);
    renderDashboardStats();
    renderOutfits();
  }, 1000);

  tick();
}
boot();

})();
</script>
